[package]
name = "clipboard-manager"
version = "0.2.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
regex = "1"
windows-registry = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "functions", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
reqwest-updater = { package = "reqwest", version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
minisign-verify = "0.3"
windows = { version = "0.61", features = ["Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_Security"] }
